
name: Pull Request Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  documentation-check:
    name: Validate documentation files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check baseline documentation files
        shell: bash
        run: |
          set -e
          test -s README.md
          test -s performance-tests/response-time-test-plan.md
          test -s performance-tests/availability-test-plan.md
          echo "Baseline documentation files exist and are non-empty."
